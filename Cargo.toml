[package]
name = "virtual-obsidian-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic state engine for virtual-obsidian"
repository = "https://github.com/Chazutsu/virtual-obsidian"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
